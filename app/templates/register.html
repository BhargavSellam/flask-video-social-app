{% extends "base.html" %}
{% block title %}Register - VidShare{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
    <h1 class="h3 mb-4">Create account</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required minlength="3">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" name="email" type="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" required minlength="6">
        </div>
        <button class="btn btn-primary w-100">Register</button>
    </form>
</div>
{% endblock %}
