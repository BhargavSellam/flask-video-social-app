{% extends "base.html" %}
{% block title %}Upload - VidShare{% endblock %}
{% block content %}
<div class="upload-card mx-auto">
    <h1 class="h3 mb-4">Upload video</h1>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" name="title" maxlength="200" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="5" name="description"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Video file</label>
            <input class="form-control" type="file" name="video" accept="video/mp4,video/webm,video/quicktime,video/x-m4v" required>
            <div class="form-text">Supported: MP4, WEBM, MOV, M4V.</div>
        </div>

        <button class="btn btn-primary">Upload video</button>
    </form>
</div>
{% endblock %}
